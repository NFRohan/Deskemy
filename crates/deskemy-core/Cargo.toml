[package]
name = "deskemy-core"
version = "0.1.0"
description = "Deskemy core — library, import, persistence and mpv bindings, shared by every frontend"
authors = ["Spooksy"]
license = "MIT"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Persistence: bundled SQLite (compiles from C via MSVC; includes FTS5)
rusqlite = { version = "0.32", features = ["bundled"] }

# Identity + hashing
uuid = { version = "1", features = ["v7"] }
blake3 = "1"
# Data export/import archives
zip = "2"

# Errors + logging
thiserror = "2"
tracing = "0.1"

# Filesystem scanning
walkdir = "2"

# Runtime FFI to libmpv (no build-time link dependency)
libloading = "0.8"

# Per-user OS data directory (paths::data_dir)
dirs = "7"

[dev-dependencies]
tempfile = "3"
proptest = "1"
