[package]
name = "deskemy-app"
version = "2.0.2"
description = "Deskemy — offline course player (Slint frontend)"
authors = ["Spooksy"]
license = "MIT"
edition = "2021"
publish = false

[[bin]]
name = "deskemy"
path = "src/main.rs"

[dependencies]
# Library, import, persistence and libmpv bindings — shared with the Tauri app.
deskemy-core = { path = "../crates/deskemy-core" }

# raw-window-handle-06: native dialogs open modal over the window.
# renderer-skia-opengl: Skia draws text hinted and properly antialiased
# (FemtoVG's is visibly rougher); FemtoVG stays available as a fallback.
# unstable-winit-030: hide the pointer with the player's controls (Slint only
# applies `mouse-cursor` on a mouse event, and they hide while it's still).
slint = { version = "1.18", features = ["raw-window-handle-06", "renderer-skia-opengl", "unstable-winit-030"] }
# The window's X11 / Wayland display, for mpv's hardware decoding on Linux
raw-window-handle = "0.6"
# OpenGL calls for the texture mpv renders video into
glow = "0.18"

# Native file / folder dialogs
rfd = "0.17"
# Pasting a course cover from the clipboard
arboard = "3.6"
# Opening resources with the system's default app
open = "5.4"
# Wall clock and "Ends at" in the player
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Offscreen --snapshot mode (PNG encoding)
png = "0.18"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cargo-packager-updater = "0.2"
# Verifying a signed installer locally (deskemy --verify-update)
minisign-verify = "0.2"
base64 = "0.22"

[target."cfg(windows)".dependencies]
# SetThreadExecutionState — keep the machine awake during playback.
# Msi* — whether this copy was installed by the MSI (the updater fetches the same kind).
# GetMonitorInfo, SetWindowPos, DWM cloaking — placing the mini player and
# switching to it out of sight, SetWindowSubclass — keeping its aspect ratio
# while resized; GetWindowRect — its debug traces. ToolHelp — the launching
# process, for the minimized-first-launch logs. HiDpi, KeyboardAndMouse —
# the title bar's maximize button for Snap Layouts (caption.rs).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_ApplicationInstallationAndServicing",
] }

# Slint's Skia renderer with subpixel (ClearType-style) text on Windows; see
# patches/i-slint-renderer-skia/README.md. Must match the slint version.
[patch.crates-io]
i-slint-renderer-skia = { path = "patches/i-slint-renderer-skia" }

[build-dependencies]
slint-build = "1.18"
# The exe's icon and version info on Windows (Explorer, shortcuts, Task Manager)
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
# updates.rs tests: the release manifest
serde_json = "1"
# examples/text_aa.rs — the same skia-safe build Slint uses (no Skia rebuild)
skia-safe = { version = "0.153.3", features = ["gl", "d3d"] }
minisign = "0.7"

# The Windows installers (cargo-packager): `cargo packager --release` from app/.
# Both match the Tauri app's, so they update an existing install in place: the
# per-user NSIS setup into %LOCALAPPDATA%\Deskemy (same product name, publisher
# and binary), and the per-machine MSI into Program Files with the Tauri MSI's
# upgrade code (installer/main.wxs). See docs/releasing.md.
[package.metadata.packager]
productName = "Deskemy"
identifier = "com.spooksy.deskemy"
publisher = "Spooksy"
copyright = "© 2026 Nayeem Fardin"
category = "Education"
description = "Offline player for your downloaded video courses."
longDescription = "Deskemy turns folders of downloaded video courses into an offline, Udemy-style library — resume, chapters, subtitles, bookmarks, tags, full-text and subtitle search, career tracks, and a study-stats dashboard. Nothing leaves your machine."
homepage = "https://github.com/NFRohan/Deskemy"
licenseFile = "../LICENSE"
beforePackagingCommand = "cargo build --release"
outDir = "target/packages"
formats = ["nsis", "wix"]
icons = ["icons/deskemy.ico"]
binaries = [{ path = "deskemy", main = true }]
resources = [
    { src = "target/release/libmpv-2.dll", target = "libmpv-2.dll" },
    { src = "target/release/licenses/*", target = "licenses" },
]

[package.metadata.packager.nsis]
installMode = "currentUser"
installerIcon = "icons/deskemy.ico"
headerImage = "installer/header.bmp"
sidebarImage = "installer/sidebar.bmp"

[package.metadata.packager.wix]
template = "installer/main.wxs"
