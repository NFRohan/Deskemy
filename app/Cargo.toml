[package]
name = "deskemy-app"
version = "1.2.2"
description = "Deskemy — offline course player (Slint frontend)"
authors = ["Spooksy"]
license = "MIT"
edition = "2021"
publish = false

[[bin]]
name = "deskemy"
path = "src/main.rs"

[dependencies]
# Library, import, persistence and libmpv bindings — shared with the Tauri app.
deskemy-core = { path = "../crates/deskemy-core" }

# raw-window-handle-06: native dialogs open modal over the window.
# renderer-skia-opengl: Skia draws text hinted and properly antialiased
# (FemtoVG's is visibly rougher); FemtoVG stays available as a fallback.
slint = { version = "1.18", features = ["raw-window-handle-06", "renderer-skia-opengl"] }
# The window's X11 / Wayland display, for mpv's hardware decoding on Linux
raw-window-handle = "0.6"
# OpenGL calls for the texture mpv renders video into
glow = "0.18"

# Native file / folder dialogs
rfd = "0.17"
# Pasting a course cover from the clipboard
arboard = "3.6"
# Opening resources with the system's default app
open = "5.4"
# Wall clock and "Ends at" in the player
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Offscreen --snapshot mode (PNG encoding)
png = "0.18"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target."cfg(windows)".dependencies]
# SetThreadExecutionState — keep the machine awake during playback.
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
tempfile = "3"
